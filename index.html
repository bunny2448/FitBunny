<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitBunny - Energetic Workout Manager</title>
    
    <meta name="theme-color" content="#FF4500">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F9F9F9;
            color: #4A4A4A;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        #root {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #FFF;
            z-index: 9999;
            padding: 40px;
            overflow: auto;
            font-family: monospace;
        }
        @keyframes bunnyHop {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
    </style>

    <script>
        // Use the absolute URL constructor to resolve paths reliably
        const swUrl = new URL('sw.js', window.location.href).href;
        const entryPoint = new URL('index.tsx', window.location.href).href;

        window.handleShimError = function(err) {
            console.error('FitBunny Loader Error:', err);
            const overlay = document.getElementById('error-overlay');
            const content = document.getElementById('error-content');
            if (overlay && content) {
                overlay.style.display = 'block';
                content.textContent = (err && err.message) ? err.message : String(err);
            }
        };

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            window.handleShimError(error || msg);
            return false;
        };

        async function startApp() {
            if ('serviceWorker' in navigator) {
                try {
                    // Register the SW. The scope defaults to the directory containing the SW script.
                    const registration = await navigator.serviceWorker.register(swUrl);
                    
                    // If the page is not yet controlled by a Service Worker, we must wait for 
                    // the SW to activate and then reload. This is necessary because the SW 
                    // only intercepts fetches for pages it controls.
                    if (!navigator.serviceWorker.controller) {
                        if (registration.active) {
                            window.location.reload();
                            return;
                        }
                        
                        registration.addEventListener('updatefound', () => {
                            const installingWorker = registration.installing;
                            installingWorker.addEventListener('statechange', () => {
                                if (installingWorker.state === 'activated') {
                                    window.location.reload();
                                }
                            });
                        });
                        return;
                    }
                } catch (err) {
                    console.warn('Service Worker registration failed:', err);
                }
            }

            // Once the SW is active and controlling the page, it will intercept the fetch
            // for index.tsx and fix its MIME type.
            const script = document.createElement('script');
            script.type = 'module-shim';
            script.src = entryPoint;
            script.onerror = () => window.handleShimError(`Failed to load application at ${entryPoint}`);
            document.body.appendChild(script);
        }

        window.addEventListener('load', startApp);
        
        document.addEventListener('esms-error', function(e) {
            window.handleShimError(e.detail.error);
        });
    </script>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js" crossorigin="anonymous"></script>
    <script type="esms-options">
    {
      "shimMode": true
    }
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="error-overlay">
        <h1 style="color: #FF4500; font-size: 1.5rem; margin-bottom: 20px; font-weight: 900;">Application Error</h1>
        <div id="error-content" style="background: #F5F5F5; padding: 20px; border-radius: 12px; font-size: 12px; white-space: pre-wrap; margin-bottom: 20px; border: 1px solid #EEE;"></div>
        <button onclick="location.reload()" style="padding: 14px 28px; background: #FF4500; color: #FFF; border: none; border-radius: 12px; font-weight: 900; letter-spacing: 0.5px; cursor: pointer;">Retry Loading</button>
    </div>

    <div id="root">
        <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background: #F9F9F9;">
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; background: #FF4500; border-radius: 16px; margin: 0 auto 24px; animation: bunnyHop 0.6s infinite alternate cubic-bezier(0.2, 0, 0.5, 1);"></div>
                <div style="font-weight: 900; letter-spacing: -1.5px; color: #1A1A1A; font-size: 1.6rem;">FitBunny</div>
                <div style="color: #FF4500; font-size: 0.75rem; margin-top: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.7;">Launching...</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitBunny - Energetic Workout Manager</title>
    
    <meta name="theme-color" content="#FF4500">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Transpiler for TSX/TS support in browser - MUST load before module shims -->
    <script src="https://cdn.jsdelivr.net/npm/sucrase@3.35.0/dist/sucrase.min.js"></script>
    
    <script>
        // Set up es-module-shims options IMMEDIATELY to ensure they are available for the loader
        window.esmsInitOptions = {
            shimMode: true,
            fetch: async (url, options) => {
                const response = await fetch(url, options);
                if (!response.ok) return response;

                const urlObj = new URL(url, window.location.href);
                // Robust check for script files based on pathname
                const isTypeScript = /\.(tsx|ts)$/.test(urlObj.pathname);
                const isJavaScript = /\.(js|mjs)$/.test(urlObj.pathname);
                const isLocal = urlObj.origin === window.location.origin;

                // If it's a file we handle or a local script that might have a null MIME type
                if (isTypeScript || (isLocal && isJavaScript)) {
                    try {
                        let content = await response.text();
                        
                        // Transpile TypeScript/JSX if necessary
                        if (isTypeScript) {
                            if (!window.sucrase) {
                                throw new Error("Sucrase not found");
                            }
                            content = window.sucrase.transform(content, {
                                transforms: ['typescript', 'jsx'],
                                production: true,
                                jsxRuntime: 'classic'
                            }).code;
                        }
                        
                        // Fix the MIME type for good: explicitly set application/javascript
                        // This bypasses the server's "null" or "text/plain" headers.
                        return new Response(content, {
                            status: response.status,
                            statusText: response.statusText,
                            headers: {
                                ...Object.fromEntries(response.headers.entries()),
                                'Content-Type': 'application/javascript; charset=utf-8'
                            }
                        });
                    } catch (err) {
                        console.error('FitBunny Loader Error:', url, err);
                        // Return an empty valid script to prevent the whole app from hanging
                        return new Response(`console.error("FitBunny: Error loading ${url}", ${JSON.stringify(err.message)});`, {
                            headers: { 'Content-Type': 'application/javascript' }
                        });
                    }
                }
                return response;
            }
        };
    </script>

    <!-- Load the shim after options are set -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js" crossorigin="anonymous"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F9F9F9;
            color: #4A4A4A;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        #root {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #loader {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
            justify-content: center;
            background: #F9F9F9;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.4s ease-out;
        }
        #error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #FFF;
            z-index: 9999;
            padding: 40px;
            overflow: auto;
            font-family: monospace;
        }
        @keyframes bunnyHop {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
    </style>

    <script>
        window.handleError = function(err) {
            console.error('FitBunny Load Error:', err);
            const overlay = document.getElementById('error-overlay');
            const content = document.getElementById('error-content');
            if (overlay && content) {
                overlay.style.display = 'block';
                content.textContent = (err && err.message) ? err.message : String(err);
            }
        };

        window.onerror = (msg, url, line, col, error) => window.handleError(error || msg);
        document.addEventListener('esms-error', (e) => window.handleError(e.detail.error));

        async function initApp() {
            // Service Worker registration
            if ('serviceWorker' in navigator) {
                try {
                    const swUrl = './sw.js';
                    navigator.serviceWorker.register(swUrl).catch(() => {});
                } catch (e) {}
            }

            // Launch the app
            const script = document.createElement('script');
            script.type = 'module-shim';
            script.src = './index.tsx';
            script.onload = () => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 400);
                }
            };
            script.onerror = () => window.handleError(new Error('Entry point (index.tsx) failed to load. Please verify your connection or reload.'));
            document.body.appendChild(script);
        }

        window.addEventListener('load', initApp);
    </script>
</head>
<body>
    <div id="error-overlay">
        <h1 style="color: #FF4500; font-size: 1.5rem; margin-bottom: 20px; font-weight: 900;">Application Error</h1>
        <div id="error-content" style="background: #F5F5F5; padding: 20px; border-radius: 12px; font-size: 12px; white-space: pre-wrap; margin-bottom: 20px; border: 1px solid #EEE;"></div>
        <button onclick="location.reload()" style="padding: 14px 28px; background: #FF4500; color: #FFF; border: none; border-radius: 12px; font-weight: 900; letter-spacing: 0.5px; cursor: pointer;">Retry Loading</button>
    </div>

    <div id="loader">
        <div style="text-align: center;">
            <div style="width: 48px; height: 48px; background: #FF4500; border-radius: 16px; margin: 0 auto 24px; animation: bunnyHop 0.6s infinite alternate cubic-bezier(0.2, 0, 0.5, 1);"></div>
            <div style="font-weight: 900; letter-spacing: -1.5px; color: #1A1A1A; font-size: 1.6rem;">FitBunny</div>
            <div style="color: #FF4500; font-size: 0.75rem; margin-top: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.7;">Warming up...</div>
        </div>
    </div>

    <div id="root"></div>
</body>
</html>

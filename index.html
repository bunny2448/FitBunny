
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitBunny - Energetic Workout Manager</title>
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FF4500">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitBunny">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2618/2618301.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- ES Module Shims: The "Shim Mode" bypasses strict MIME type checks -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F9F9F9;
            color: #4A4A4A;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        #root {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background: #F9F9F9; font-family: sans-serif;">
            <div style="text-align: center;">
                <div style="width: 44px; height: 44px; background: #FF4500; border-radius: 14px; margin: 0 auto 20px; animation: bounce 1s infinite alternate ease-in-out;"></div>
                <div style="font-weight: 900; letter-spacing: -1px; color: #1A1A1A; font-size: 1.4rem;">FitBunny</div>
                <div style="color: #FF4500; font-size: 0.7rem; margin-top: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;">Warming Up...</div>
            </div>
        </div>
    </div>
    <style>
        @keyframes bounce {
            from { transform: translateY(0) scale(1); opacity: 0.9; }
            to { transform: translateY(-10px) scale(1.05); opacity: 1; }
        }
    </style>
    <!-- type="module-shim" is the key to fixing the MIME error -->
    <script type="module-shim" src="./index.tsx"></script>
</body>
</html>

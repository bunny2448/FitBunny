
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; URL='./index.html'">
    <title>FitBunny - Redirecting</title>
</head>
<body>
    <script>
        // If we are in a subfolder, redirect to that subfolder's index
        const path = window.location.pathname;
        if (path.includes('/FitBunny')) {
            window.location.href = '/FitBunny/index.html';
        } else {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
